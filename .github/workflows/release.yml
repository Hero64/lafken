name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.15.0 or 0.15.0-beta.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run — build, test and pack, but publish nothing and push nothing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 🚀 ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: write # release commit, tag and GitHub release
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ✅ Validate version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="$VERSION_INPUT"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid semver version"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "::error::Tag $version already exists"
            exit 1
          fi

          # A version with a pre-release suffix must never become the default
          # install for everyone, so it goes out under the "next" dist-tag.
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"
          echo "Releasing $version under dist-tag '$dist_tag'"

      - name: 📝 Extract release notes
        run: node scripts/changelog-section.js "$VERSION" | tee "$RUNNER_TEMP/release-notes.md"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Lint
        run: pnpm lint

      - name: 🏗️ Build
        run: pnpm build

      - name: 🔠 Check types
        run: pnpm check-types

      - name: 🧪 Test
        run: pnpm test

      - name: 🔢 Set version
        run: node scripts/set-version.js "$VERSION"

      - name: 🔖 Create release commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The bump may already be committed, e.g. when the release branch was
          # prepared by hand. Committing then fails with "nothing to commit", so
          # only commit when the version actually changed.
          if git diff --quiet; then
            echo "Packages are already at $VERSION, no release commit needed"
          else
            git commit -am "chore(release): $VERSION"
          fi

          git tag -a "$VERSION" -m "$VERSION"

      # The commit is pushed before npm because publishing is irreversible and a
      # real push is the only dependable way to learn whether branch rules will
      # reject it: `git push --dry-run` may not trigger server-side rule
      # evaluation, and a rejected push can still exit 0 with the rejection only
      # on stderr. 0.15.0 published all 12 packages and only then discovered the
      # ruleset refused the commit.
      # The tag is pushed after npm instead, so a tag always means "released".
      - name: ⬆️ Push release commit
        if: ${{ !inputs.dry_run }}
        run: |
          out=$(git push origin "HEAD:$GITHUB_REF_NAME" 2>&1) && status=0 || status=$?
          echo "$out"
          if [ "${status:-0}" -ne 0 ] || echo "$out" | grep -qE "remote rejected|GH013"; then
            echo "::error::Push to $GITHUB_REF_NAME was rejected — nothing was published."
            exit 1
          fi

      - name: 📦 Publish to npm
        run: |
          pnpm -r publish \
            --access public \
            --no-git-checks \
            --tag "$DIST_TAG" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: ⬆️ Push release tag
        if: ${{ !inputs.dry_run }}
        run: git push origin "refs/tags/$VERSION"

      - name: 🏷️ Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease="--prerelease"
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            $prerelease

      - name: 📋 Summary
        run: |
          {
            echo "## $VERSION"
            echo
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "**Dry run** — nothing was published or pushed."
            else
              echo "Published to npm under dist-tag \`$DIST_TAG\`."
            fi
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
